<!doctype html>
<!-- The marking page for the detector's measurement (step 17). Development only:
     served by `npm run dev` at /mark.html, not part of the build. -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mark the signs</title>
    <style>
      :root { color-scheme: light dark; --ground: #f4f5f7; --ink: #1d2230; --muted: #667;
              --truth: #1db954; --guess: #ffffff; --line: #ccd; }
      @media (prefers-color-scheme: dark) {
        :root { --ground: #15171c; --ink: #e8eaf0; --muted: #99a; --line: #334; }
      }
      body { margin: 0; background: var(--ground); color: var(--ink);
             font: 14px/1.4 system-ui, sans-serif; }
      header { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center;
               padding: 10px 16px; border-bottom: 1px solid var(--line); }
      header b { font-size: 15px; }
      button { font: inherit; padding: 6px 12px; border-radius: 8px;
               border: 1px solid var(--line); background: transparent; color: inherit;
               cursor: pointer; }
      button.on { border-color: var(--truth); color: var(--truth); }
      #stage { display: flex; justify-content: center; padding: 12px 16px; }
      canvas { max-width: 100%; touch-action: none; cursor: crosshair; }
      .muted { color: var(--muted); }
      #verdict.good { color: var(--truth); }
      #verdict.wrong { color: #e5484d; }
      #verdict.tolerable { color: #d4a72c; }
    </style>
  </head>
  <body>
    <header>
      <b id="name">…</b>
      <span id="count" class="muted"></span>
      <span id="verdict"></span>
      <span style="flex: 1"></span>
      <button id="prev" title="Left arrow">◀ Prev</button>
      <button id="next" title="Right arrow">Next ▶</button>
      <button id="todo" title="U">Next unmarked</button>
      <button id="nosign" title="N">No sign</button>
      <button id="clear" title="Delete">Clear</button>
    </header>
    <p class="muted" style="margin: 8px 16px 0">
      Drag a box around the sign — the main sign and every plate under it. Green: your
      box. White dashed: what the app suggests. Saved as you go, to testset/frames.json.
    </p>
    <div id="stage"><canvas id="canvas"></canvas></div>
    <script type="module" src="/tools/mark.ts"></script>
  </body>
</html>
